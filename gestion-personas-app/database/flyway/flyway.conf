# Flyway Configuration
# https://flywaydb.org/documentation/configuration/configfile

# JDBC URL for PostgreSQL connection
# Will be overridden by environment variables in Docker
flyway.url=jdbc:postgresql://postgres:5432/personas_db
flyway.user=admin
flyway.password=admin123

# Locations to scan for migrations
flyway.locations=filesystem:/flyway/sql

# Schema to manage
flyway.schemas=public

# Table to store migration history
flyway.table=flyway_schema_history

# Validate on migrate
flyway.validateOnMigrate=true

# Clean disabled for safety in production
flyway.cleanDisabled=true

# Baseline for existing databases
flyway.baselineOnMigrate=true
flyway.baselineVersion=0

# Connect retries
flyway.connectRetries=10
flyway.connectRetriesInterval=5

# Encoding
flyway.encoding=UTF-8

# Placeholders for environment-specific values
flyway.placeholderReplacement=true
