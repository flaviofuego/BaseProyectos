services:
  # PostgreSQL con pgvector - Development Override
  postgres:
    image: pgvector/pgvector:pg15

  # Service Registry - Development Override
  service-registry:
    build:
      context: ./services/registry
      dockerfile: Dockerfile.dev
    container_name: service_registry_dev
    volumes:
      - ./services/registry:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
      - SERVICE_REGISTRY_PORT=${SERVICE_REGISTRY_PORT:-3010}
    networks:
      - app-network

  # API Gateway - Development Override
  gateway:
    build: 
      context: ./gateway
      dockerfile: Dockerfile.dev
    container_name: api_gateway_dev
    volumes:
      - ./gateway:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
      - SERVICE_REGISTRY_URL=${SERVICE_REGISTRY_URL}
    networks:
      - app-network

  # Servicio de Autenticacion - Development Override
  auth-service:
    build:
      context: ./services/auth
      dockerfile: Dockerfile.dev
    container_name: auth_service_dev
    volumes:
      - ./services/auth:/app
      - ./services/shared:/app/shared
      - /app/node_modules
      - //var/run/docker.sock:/var/run/docker.sock  # Docker socket para control de contenedores (Windows)
    environment:
      - NODE_ENV=development
      - JWT_SECRET=${JWT_SECRET}
      - REDIS_URL=${REDIS_URL}
      - DATABASE_URL=${DATABASE_URL_TEST}
      - AUTH0_DOMAIN=${AUTH0_DOMAIN}
      - AUTH0_CLIENT_ID=${AUTH0_CLIENT_ID}
      - AUTH0_CLIENT_SECRET=${AUTH0_CLIENT_SECRET}
      - AUTH0_CALLBACK_URL=${AUTH0_CALLBACK_URL}
      - SESSION_SECRET=${SESSION_SECRET}
      - FRONTEND_URL=${FRONTEND_URL}
      - SERVICE_REGISTRY_URL=${SERVICE_REGISTRY_URL}
      - LOG_SERVICE_URL=${LOG_SERVICE_URL}
      - CONSULTA_SERVICE_CONTAINER=consulta_service_dev
    networks:
      - app-network

  # Servicio de GestiÃ³n de Personas - Development Override
  personas-service:
    build:
      context: ./services/personas
      dockerfile: Dockerfile.dev
    container_name: personas_service_dev
    volumes:
      - ./services/personas:/app
      - /app/node_modules
      - personas_uploads:/uploads
      - ./services/shared:/app/shared
    environment:
      - NODE_ENV=development
      - SERVICE_REGISTRY_URL=${SERVICE_REGISTRY_URL}
      - LOG_SERVICE_URL=${LOG_SERVICE_URL}
    networks:
      - app-network

  # Servicio de Consultas - Development Override
  consulta-service:
    build:
      context: ./services/consulta
      dockerfile: Dockerfile.dev
    container_name: consulta_service_dev
    volumes:
      - ./services/consulta:/app
      - /app/node_modules
      - ./services/shared:/app/shared
    environment:
      - NODE_ENV=development
      - SERVICE_REGISTRY_URL=${SERVICE_REGISTRY_URL}
      - LOG_SERVICE_URL=${LOG_SERVICE_URL}
    deploy:
      replicas: 1  # Override to 1 replica for development
    networks:
      - app-network

  # Servicio de NLP - Development Override (con pgvector)
  nlp-service:
    build:
      context: ./services/nlp
      dockerfile: Dockerfile.dev
    container_name: nlp_service_dev
    volumes:
      - ./services/nlp:/app
      - /app/node_modules
      - ./services/shared:/app/shared
    environment:
      - NODE_ENV=development
      - SERVICE_REGISTRY_URL=${SERVICE_REGISTRY_URL}
      - LOG_SERVICE_URL=${LOG_SERVICE_URL}
      - AZURE_FOUNDRY_ENDPOINT=${AZURE_FOUNDRY_ENDPOINT}
      - AZURE_EMBEDDING_MODEL=${AZURE_EMBEDDING_MODEL}
      - AZURE_CHAT_MODEL=${AZURE_CHAT_MODEL}
      - AZURE_API_KEY=${AZURE_API_KEY}
    networks:
      - app-network

  # Servicio de Logs - Development Override
  log-service:
    build:
      context: ./services/log
      dockerfile: Dockerfile.dev
    container_name: log_service_dev
    volumes:
      - ./services/log:/app
      - /app/node_modules
      - ./services/shared:/app/shared
    environment:
      - NODE_ENV=development
      - SERVICE_REGISTRY_URL=${SERVICE_REGISTRY_URL}
    networks:
      - app-network

  # Frontend Flask - Development Override
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: flask_app_dev
    volumes:
      - ./frontend:/app
      - /app/__pycache__
    environment:
      - FLASK_ENV=development
      - FLASK_DEBUG=1
      - API_GATEWAY_URL=${API_GATEWAY_URL}
    networks:
      - app-network

volumes:
  personas_uploads:

networks:
  app-network:
    driver: bridge
