services:
  # Service Registry
  service-registry:
    build: ./services/registry
    container_name: service_registry
    ports:
      - "3010:3010"
    environment:
      - NODE_ENV=production
      - SERVICE_REGISTRY_PORT=${SERVICE_REGISTRY_PORT:-3010}
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://localhost:3010/health",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - app-network
    depends_on:
      - postgres
      - redis

  # Base de datos PostgreSQL con pgvector
  postgres:
    image: pgvector/pgvector:pg15
    container_name: personas_db
    environment:
      POSTGRES_DB: personas_db
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/backups:/backups
      - ./database/init-db.sh:/docker-entrypoint-initdb.d/01-init-db.sh:ro
      - ./database/init.sql:/init-scripts/init.sql:ro
      - ./database/migrations:/init-scripts/migrations:ro
      - ./database/backup.sh:/backups/backup.sh:ro
      - ./database/restore.sh:/backups/restore.sh:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d personas_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - app-network

  # Redis para cache y sesiones
  redis:
    image: redis:7-alpine
    container_name: personas_redis
    ports:
      - "6379:6379"
    networks:
      - app-network

  # Vector Database para RAG - DEPRECATED: Ahora se usa pgvector en PostgreSQL
  # qdrant:
  #   image: qdrant/qdrant
  #   container_name: personas_vectordb
  #   ports:
  #     - "6333:6333"
  #   volumes:
  #     - qdrant_data:/qdrant/storage
  #   networks:
  #     - app-network

  # API Gateway
  gateway:
    build: ./gateway
    container_name: api_gateway
    ports:
      - "8001:8001"
    environment:
      - NODE_ENV=production
      - SERVICE_REGISTRY_URL=${SERVICE_REGISTRY_URL}
    depends_on:
      - service-registry
    networks:
      - app-network

  # Servicio de Autenticacion
  auth-service:
    build: ./services/auth
    container_name: auth_service
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock # Docker socket para control de contenedores
      - ./services/shared:/app/shared
    environment:
      - NODE_ENV=production
      - JWT_SECRET=${JWT_SECRET}
      - REDIS_URL=${REDIS_URL}
      - DATABASE_URL=${DATABASE_URL}
      - AUTH0_DOMAIN=${AUTH0_DOMAIN}
      - AUTH0_CLIENT_ID=${AUTH0_CLIENT_ID}
      - AUTH0_CLIENT_SECRET=${AUTH0_CLIENT_SECRET}
      - AUTH0_CALLBACK_URL=${AUTH0_CALLBACK_URL}
      - SESSION_SECRET=${SESSION_SECRET}
      - FRONTEND_URL=${FRONTEND_URL}
      - SERVICE_REGISTRY_URL=${SERVICE_REGISTRY_URL}
      - LOG_SERVICE_URL=${LOG_SERVICE_URL}
      - SERVICE_NAME=auth-service
      - SERVICE_PORT=3001
      - CONSULTA_SERVICE_CONTAINER=consulta_service
    depends_on:
      - postgres
      - redis
      - service-registry
      - log-service
    networks:
      - app-network

  # Servicio de Gestion de Personas (CRUD)
  personas-service:
    build: ./services/personas
    container_name: personas_service
    environment:
      - NODE_ENV=production
      - DATABASE_URL=${DATABASE_URL}
      - SERVICE_REGISTRY_URL=${SERVICE_REGISTRY_URL}
      - LOG_SERVICE_URL=${LOG_SERVICE_URL}
      - NLP_SERVICE_URL=${NLP_SERVICE_URL}
      - SERVICE_NAME=personas-service
      - SERVICE_PORT=3002
    volumes:
      - personas_uploads:/uploads
      - ./services/shared:/app/shared
    depends_on:
      - postgres
      - service-registry
      - log-service
      - nlp-service
    networks:
      - app-network

  # Servicio de Consultas (escalable)
  consulta-service:
    build: ./services/consulta
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
      restart_policy:
        condition: on-failure
    environment:
      - NODE_ENV=production
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
      - SERVICE_REGISTRY_URL=${SERVICE_REGISTRY_URL}
      - LOG_SERVICE_URL=${LOG_SERVICE_URL}
      - SERVICE_NAME=consulta-service
      - SERVICE_PORT=3003
    depends_on:
      - postgres
      - redis
      - service-registry
      - log-service
    networks:
      - app-network
    volumes:
      - ./services/shared:/app/shared

  # Servicio de NLP con RAG (usando pgvector)
  nlp-service:
    build: ./services/nlp
    container_name: nlp_service
    environment:
      - NODE_ENV=production
      - AZURE_FOUNDRY_ENDPOINT=${AZURE_FOUNDRY_ENDPOINT}
      - AZURE_EMBEDDING_MODEL=${AZURE_EMBEDDING_MODEL}
      - AZURE_CHAT_MODEL=${AZURE_CHAT_MODEL}
      - AZURE_API_KEY=${AZURE_API_KEY}
      - DATABASE_URL=${DATABASE_URL}
      - LOG_SERVICE_URL=${LOG_SERVICE_URL}
      - SERVICE_REGISTRY_URL=${SERVICE_REGISTRY_URL}
      - SERVICE_NAME=nlp-service
      - SERVICE_PORT=3004
    depends_on:
      - postgres
      - service-registry
      - log-service
    networks:
      - app-network
    volumes:
      - ./services/shared:/app/shared

  # Servicio de Logs
  log-service:
    build: ./services/log
    container_name: log_service
    environment:
      - NODE_ENV=production
      - DATABASE_URL=${DATABASE_URL}
      - SERVICE_REGISTRY_URL=${SERVICE_REGISTRY_URL}
      - SERVICE_NAME=log-service
      - SERVICE_PORT=3005
    depends_on:
      - postgres
      - service-registry
    networks:
      - app-network
    volumes:
      - ./services/shared:/app/shared

  # Frontend Flask
  frontend:
    build: ./frontend
    container_name: flask_app
    ports:
      - "5001:5001"
    environment:
      - FLASK_ENV=production
      - API_GATEWAY_URL=${API_GATEWAY_URL}
      - FLASK_SECRET_KEY=${FLASK_SECRET_KEY}
    depends_on:
      - gateway
    networks:
      - app-network

volumes:
  postgres_data:
  # qdrant_data:  # DEPRECATED: Ahora se usa pgvector
  personas_uploads:

networks:
  app-network:
    driver: bridge
